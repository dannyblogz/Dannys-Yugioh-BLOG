<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blue-Eyes Space Blog</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            color: #ffffff; 
            
            /* FALLBACK BACKGROUND COLOR */
            background-color: #0b0d19; 

            /* THIS STACKS THE FLYING DRAGON ON TOP OF THE SPACE STARS */
            background-image: 
                url('bewd.jpeg'), /* Layer 1: Your giant flying dragon artwork */
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px), /* Layer 2: Star layers */
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            
            /* POSITION AND SIZE MANAGEMENT FOR THE GIANT FLYING DRAGON BACKGROUND */
            background-repeat: no-repeat, repeat, repeat, repeat;
            background-position: center 30%, 0 0, 40px 60px, 130px 270px;
            background-size: 550px auto, 550px 550px, 350px 350px, 250px 250px;
            background-attachment: fixed; /* Keeps the massive background dragon steady while scrolling */
        }

        /* THE TEXT CONTAINER WITH HIGHER CONTRAST */
        .content-box {
            max-width: 800px;
            margin: 0 auto 30px auto;
            /* Made the black box slightly darker (0.45) so the white text pops off the giant dragon behind it */
            background: rgba(11, 13, 25, 0.45); 
            padding: 30px;
            border-radius: 12px;
            backdrop-filter: blur(8px); /* Blurs the flying dragon artwork subtly behind the container window */
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        h1 { color: #54a0ff; margin-top: 0; text-shadow: 0 0 10px rgba(84, 160, 255, 0.5); }
        .date { color: #888; font-style: italic; }

        /* KEEPING THE CORNER DRAGON CARD ACTIVE AS WELL */
        .corner-dragon {
           .corner-dragon {
    position: fixed;   
    bottom: 5px;       /* Dropped down from 20px to 5px */
    right: 5px;        /* Moved closer to the edge from 20px to 5px */
    width: 90px;       /* Shrunk down from 140px to 90px */
    height: auto;
    border: 2px solid #4a90e2; 
    border-radius: 6px;
    box-shadow: 0 0 10px rgba(74, 144, 226, 0.6); 
    z-index: 1000;     
}

    </style>
</head>
<body>

    <div class="content-box">
        <h1>Blue eyes blog</h1>
        <p class="date">Published on: July 29, 2026</p>

        <p>hi</p>
        
        <p>i made this by my self lol</p>
        
        <p>i really like yugioh as you can tell i play bewd tell me what deck you guys like!</p>
    </div>

    <!-- LIVE COMMENT SECTION PORTAL PLACEHOLDER -->
    <div class="content-box">
        <div id="cusdis_thread"
  data-host="https://cusdis.com"
  data-app-id="5fa8397a-9703-4ec0-80c7-a9a1c0de3422"
  data-page-id="{{ PAGE_ID }}"
  data-page-url="{{ PAGE_URL }}"
  data-page-title="{{ PAGE_TITLE }}"
></div>
<script async defer src="https://cusdis.com/js/cusdis.es.js"></script>



    <!-- TINY DRAGON CARD REMAINS PINS IN CORNER VIEW -->
    <img src="blue-eyes.png.jpeg" alt="Blue-Eyes White Dragon" class="corner-dragon">

</body>
</html>
